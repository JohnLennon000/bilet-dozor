# Настройки «Дозора билетов». Править можно прямо на GitHub с телефона:
# откройте файл → значок карандаша → изменить → «Commit changes». Проверка запустится сама.
# Если в файле ошибка, придёт уведомление с объяснением.

train:
  enabled: true
  from: Туймазы          # станция отправления (так, как на сайте РЖД)
  to: Москва             # город назначения, все вокзалы
  # Коды станций определяются автоматически. Если проверка пишет «не нашёл станцию»,
  # укажите коды вручную (цифры; их показывает проверка источников — probe):
  # from_code: "2060500"
  # to_code: "2000000"
  dates: ["2027-01-09"]  # даты отправления
  trains: []             # пусто — любой прямой поезд; можно ограничить: ["301У"]
  sources: [rzd]         # откуда брать данные
  # Ссылки «купить» в уведомлении и в приложении. Подстановки: {date} {dd} {mm} {yyyy}
  # {from_code} {to_code} {from_slug} {to_slug} {From_slug} {To_slug}.
  # Первая ссылка (primary) — главная кнопка. Адреса Яндекса и Туту составлены по образцу их сайтов
  # и не проверены: если ссылка не открывается, поправьте её здесь или удалите.
  links:
    - label: Купить на РЖД
      url: "https://ticket.rzd.ru/searchresults/v/1/{from_code}/{to_code}/{date}"
      primary: true
    - label: Яндекс Путешествия
      url: "https://travel.yandex.ru/trains/{from_slug}--{to_slug}/?when={date}"
    - label: Туту
      url: "https://www.tutu.ru/poezda/{From_slug}/{To_slug}/"

# Дополнительные маршруты поезда — у каждого своя карточка и свои уведомления.
# Ссылки «купить» и источники — как у основного, если не указать свои (links, sources, trains).
extra_trains:
  - label: эксперимент   # временная проверка: удалите этот блок, когда она станет не нужна
    from: Москва
    to: Сакмарская
    dates: ["2026-12-29"]

flights:
  enabled: true
  origin: UUA            # Бугульма (код IATA)
  destination: MOW       # Москва, все аэропорты
  dates: ["2027-01-09", "2027-01-10"]
  direct_only: true      # только прямые рейсы
  interval_min: 30       # как часто проверять рейсы (минут)
  currency: rub
  sources: [travelpayouts]
  links:
    - label: Найти на Aviasales
      url: "https://www.aviasales.ru/search/{origin}{dd}{mm}{destination}1"
      primary: true

notify:
  price_min_rub: 50      # сообщать об изменении цены не меньше чем на столько ₽ …
  price_min_pct: 1       # … и не меньше чем на столько %
  price_gap_min: 10      # не чаще одного сообщения о цене за столько минут
  sold_out: true         # сообщать, что билеты закончились
  new_train: true        # сообщать о новых поездах и рейсах на эти даты
  digest_hour: 9         # утренняя сводка в этот час по Москве (null — выключить)
  error_after_min: 90    # сообщить, если источник не отвечает дольше стольких минут
  quiet_from: 23         # необязательные уведомления без звука с 23:00 …
  quiet_to: 8            # … до 8:00 (о появлении билетов — всегда со звуком)
