name: Проверка билетов

on:
  schedule:
    # Примерно каждые 10 минут. GitHub не гарантирует точность: в часы нагрузки запуск может задержаться.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Сначала проверить источники (probe): отвечает ли РЖД, как разбирается ответ"
        type: boolean
        default: false
      digest:
        description: "Прислать сводку сейчас"
        type: boolean
        default: false
      cron:
        description: "Плановый запуск внешнего будильника (cron-job.org): обычная проверка, без --force"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [config.yaml, "push/**"]   # новые настройки или подключённый телефон — проверить сразу

permissions:
  contents: write

concurrency:
  group: dozor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest   # если РЖД не отвечает с серверов GitHub — см. README, «РЖД не отвечает»
    timeout-minutes: 10
    env:
      # Если задан секрет TS_AUTHKEY, запросы идут через телефон в России (Tailscale, «выходной узел»).
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Запуски идут по очереди (concurrency): ждавший в очереди должен взять свежие данные предыдущего, а не коммит, на котором его запустили.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Доверять УЦ Минцифры (сертификат rzd.ru)
        run: |
          # Обычные центры (certifi) + корневой сертификат Минцифры: им подписан сертификат ticket.rzd.ru.
          bundle="$RUNNER_TEMP/ca-bundle.pem"
          cat "$(python -c 'import certifi; print(certifi.where())')" certs/russian_trusted_root_ca.pem > "$bundle"
          echo "REQUESTS_CA_BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "Сертификатов в наборе: $(grep -c 'BEGIN CERTIFICATE' "$bundle")"

      - name: Подключиться к телефону (Tailscale)
        if: env.TS_AUTHKEY != ''
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: dozor-github

      - name: Пустить интернет через телефон
        if: env.TS_AUTHKEY != ''
        continue-on-error: true
        run: |
          # Ищем устройство, разрешённое как выходной узел и сейчас в сети (телефон). Нет такого — работаем напрямую.
          node=$(tailscale status --json | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          print(next((p["TailscaleIPs"][0] for p in (d.get("Peer") or {}).values() if p.get("ExitNodeOption") and p.get("Online")), ""))')
          # Что видно в сети Tailscale (только имя и флаги — без адресов): помогает понять, почему телефон не подошёл
          tailscale status --json | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          for p in (d.get("Peer") or {}).values():
              print("устройство:", p.get("HostName"), "| в сети:", "да" if p.get("Online") else "нет", "| выход разрешён:", "да" if p.get("ExitNodeOption") else "нет")' || true
          if [ -z "$node" ]; then
            echo "::warning::Телефон не в сети или не разрешён как выходной узел — проверка идёт напрямую, РЖД может не ответить"
            exit 0
          fi
          sudo tailscale set --exit-node="$node"
          echo "Страна выхода: $(curl -s -m 15 https://ipinfo.io/country || echo '?')"

      - name: Проверка источников (probe)
        if: ${{ inputs.probe }}
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RZD_PROXY: ${{ secrets.RZD_PROXY }}
        run: python -m dozor probe

      - name: Проверить билеты
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          RZD_PROXY: ${{ secrets.RZD_PROXY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m dozor ${{ inputs.digest && '--force-digest' || '' }} ${{ github.event_name == 'workflow_dispatch' && !inputs.cron && '--force' || '' }}

      - name: Сохранить данные
        if: always()
        run: |
          if [ -n "$TS_AUTHKEY" ]; then sudo tailscale set --exit-node= 2>/dev/null || true; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in docs/data state push; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -q -m "Данные $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            git fetch -q --depth=50 origin main
            git rebase -q -X theirs origin/main || { git rebase --abort; exit 1; }   # конфликт в данных — берём данные этого запуска
          done
          exit 1
